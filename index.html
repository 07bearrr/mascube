<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>业务员辅助系统</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <!-- 左侧导航栏 -->
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-logo">📋</div>
        <h1>业务员辅助系统</h1>
      </div>
      <nav class="side-nav">
        <button class="side-nav-item active" data-module="contracts">📦 合同管理</button>
        <button class="side-nav-item" data-module="tracking">📈 进度追踪</button>
        <button class="side-nav-item" data-module="freight">🚚 运费计算</button>
        <button class="side-nav-item" data-module="quotes">💰 已有报价</button>
        <button class="side-nav-item" data-module="admin" id="navAdmin" hidden>👤 账号管理</button>
      </nav>
      <div class="sidebar-foot">
        <span id="modeBadge" class="badge mode"></span>
        <div class="user-chip">
          <span id="userName">未登录</span>
          <button id="btnLogout" class="btn-mini" type="button" hidden>退出</button>
        </div>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main">
      <!-- 模块一：合同管理 -->
      <section id="module-contracts" class="module-panel">
        <header class="page-head">
          <h2>合同管理</h2>
          <button class="btn btn-primary" id="btnAdd">+ 新增合同</button>
        </header>
        <section class="toolbar">
          <input type="search" id="searchInput" class="search" placeholder="搜索销售单号 / 供应商 / 货号">
          <select id="typeFilter" class="select"></select>
        </section>
        <section id="contractList"></section>
      </section>

      <!-- 模块二：进度追踪 -->
      <section id="module-tracking" class="module-panel" hidden>
        <header class="page-head">
          <h2>进度追踪</h2>
        </header>
        <section class="toolbar">
          <input type="search" id="trackSearch" class="search" placeholder="搜索销售单号 / 货号">
          <select id="trackTypeFilter" class="select"></select>
        </section>
        <section id="trackList"></section>
      </section>

      <!-- 模块三：运费计算 -->
      <section id="module-freight" class="module-panel" hidden>
        <header class="page-head">
          <h2>运费计算</h2>
        </header>
        <div class="freight-wrap">
          <div class="freight-card">
            <div>
              <h3 class="freight-title">参数设置<span class="freight-note">修改后自动记住</span></h3>
              <div class="freight-grid">
                <label>陆运柜子价格（默认 2000）
                  <input type="number" id="f_truck_price" step="1" placeholder="2000">
                </label>
                <label>汇率（默认 6.7）
                  <input type="number" id="f_rate" step="0.01" placeholder="6.7">
                </label>
                <label>海运柜子价格（默认 2800）
                  <input type="number" id="f_sea_price" step="1" placeholder="2800">
                </label>
              </div>
            </div>
            <div>
              <h3 class="freight-title">计算</h3>
              <div class="freight-grid">
                <label>总体积（m³）
                  <input type="number" id="f_volume" step="0.1" placeholder="如 68">
                </label>
              </div>
            </div>
            <div class="freight-result">
              <div class="result-box">
                <div class="label">陆运费（总体积÷68×柜子价格×汇率）</div>
                <div class="value" id="f_land">¥0.00</div>
              </div>
              <div class="result-box">
                <div class="label">海运费（总体积÷68×海运柜子价格×汇率）</div>
                <div class="value" id="f_sea">¥0.00</div>
              </div>
              <div class="result-box total">
                <div class="label">合计</div>
                <div class="value" id="f_total">¥0.00</div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- 模块四：已有报价 -->
      <section id="module-quotes" class="module-panel" hidden>
        <header class="page-head">
          <h2>已有报价</h2>
          <button class="btn btn-primary" id="btnQuoteAdd">+ 新增报价</button>
        </header>
        <div class="quotes-layout">
          <aside class="folder-panel">
            <div class="folder-head">
              <strong>大类 / 文件夹</strong>
              <button class="btn-mini" id="btnFolderAdd" type="button">+ 新建</button>
            </div>
            <div class="folder-list" id="folderList"></div>
          </aside>
          <div class="quotes-main">
            <section class="toolbar">
              <input type="search" id="quoteSearch" class="search" placeholder="搜索货号 / 产品名称 / 供应商">
            </section>
            <section id="quoteList"></section>
          </div>
        </div>
      </section>

      <!-- 模块五：账号管理（仅管理员） -->
      <section id="module-admin" class="module-panel" hidden>
        <header class="page-head">
          <h2>账号管理</h2>
          <button class="btn btn-primary" id="btnAdminAddUser">+ 新增账号</button>
        </header>
        <section id="adminUserList"></section>
      </section>
    </main>
  </div>

  <!-- 合同表单弹窗 -->
  <div class="modal-mask" id="modalMask" hidden>
    <div class="modal contract-modal">
      <div class="modal-head">
        <h2 id="modalTitle">新增合同</h2>
        <button class="close" id="modalClose" type="button">×</button>
      </div>
      <form id="contractForm" class="form-grid">
        <label>销售单号
          <input id="f_sales_order_no" type="text" placeholder="如 SO-2024-001">
        </label>
        <label>供应商
          <input id="f_supplier" type="text" placeholder="如 XX工厂">
        </label>
        <label>签订日期
          <input id="f_sign_date" type="date">
        </label>

        <div class="span2 items-section">
          <div class="items-head">
            <strong>产品信息</strong>
            <button class="btn-mini" id="btnAddItem" type="button">+ 添加货号</button>
          </div>
          <div id="itemsContainer"></div>
        </div>

        <div class="form-actions span2">
          <button type="button" class="btn" id="modalCancel">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 进度更新弹窗 -->
  <div class="modal-mask" id="progressModalMask" hidden>
    <div class="modal">
      <div class="modal-head">
        <h2 id="progressModalTitle">更新进度</h2>
        <button class="close" id="progressModalClose" type="button">×</button>
      </div>
      <form id="progressForm" class="form-grid">
        <div class="span2" id="progressContext"></div>
        <div class="span2">
          <div id="progressItems"></div>
        </div>
        <div class="form-actions span2">
          <button type="button" class="btn" id="progressModalCancel">取消</button>
          <button type="submit" class="btn btn-primary">保存进度</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 报价表单弹窗 -->
  <div class="modal-mask" id="quoteModalMask" hidden>
    <div class="modal contract-modal">
      <div class="modal-head">
        <h2 id="quoteModalTitle">新增报价</h2>
        <button class="close" id="quoteModalClose" type="button">×</button>
      </div>
      <form id="quoteForm" class="form-grid">
        <label>所属大类
          <select id="q_folder_id"></select>
        </label>
        <div class="span2">
          <div class="item-grid" id="quoteFields"></div>
        </div>
        <div class="span2 image-section">
          <div class="items-head">
            <strong>图片（可上传多张）</strong>
            <button class="btn-mini" id="btnQuoteImg" type="button">+ 添加图片</button>
          </div>
          <input type="file" id="quoteImgInput" accept="image/*" multiple hidden>
          <div class="image-previews" id="quoteImagePreviews"></div>
        </div>
        <div class="form-actions span2">
          <button type="button" class="btn" id="quoteModalCancel">取消</button>
          <button type="submit" class="btn btn-primary">保存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 移动报价弹窗 -->
  <div class="modal-mask" id="moveModalMask" hidden>
    <div class="modal">
      <div class="modal-head">
        <h2>移动到大类</h2>
        <button class="close" id="moveModalClose" type="button">×</button>
      </div>
      <form id="moveForm" class="form-grid">
        <label>目标大类
          <select id="moveFolderId"></select>
        </label>
        <div class="form-actions span2">
          <button type="button" class="btn" id="moveModalCancel">取消</button>
          <button type="submit" class="btn btn-primary">确定移动</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 灯箱（看大图） -->
  <div class="lightbox" id="lightbox" hidden><img id="lightboxImg" alt=""></div>

  <!-- 登录 / 注册 -->
  <div class="auth-overlay" id="authOverlay">
    <div class="auth-card">
      <div class="auth-brand">📋 业务员辅助系统</div>
      <div class="auth-tabs">
        <button class="auth-tab active" id="authTabLogin" type="button">登录</button>
        <button class="auth-tab" id="authTabRegister" type="button">注册</button>
      </div>
      <form id="authForm" autocomplete="off">
        <label>账号
          <input id="authUsername" type="text" placeholder="输入账号">
        </label>
        <label>密码
          <input id="authPassword" type="password" placeholder="输入密码">
        </label>
        <button type="submit" class="btn btn-primary btn-block" id="authSubmit">登 录</button>
      </form>
      <div class="auth-msg" id="authMsg"></div>
    </div>
  </div>

  <!-- 提示浮层 -->
  <div id="toast" class="toast" hidden></div>

  <script src="config.js"></script>
  <script src="storage.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
